name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: rustup component add clippy rustfmt
      - run: rustup target add wasm32-wasip2
      - run: mise run check
