pre-commit:
  parallel: true
  jobs:
    - name: fmt
      glob: "*.rs"
      run: cargo fmt --check
    - name: clippy
      glob: "*.rs"
      run: cargo clippy --target wasm32-wasip2 --all-targets -- -D warnings
    - name: test
      glob: "*.rs"
      run: cargo test
    - name: kstore
      run: mise run kstore:pack --stage
